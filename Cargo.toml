[workspace]
members = ["esdicawt", "esdicawt-spec", "esdicawt-test-vector", "interop", "spice-oidc-cwt", "status-list"]
# "esdicawt-test-vector" and "interop" require esdicawt without the "status" feature, which other members enable
default-members = ["esdicawt", "esdicawt-spec", "spice-oidc-cwt", "status-list"]
resolver = "3"

[workspace.package]
version = "0.15.0"
edition = "2024"
authors = []

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.cargo]
# "cargo hack --no-dev-deps" strips dev-dependencies, making workspace dependencies only used as such look unused
unused_workspace_dependencies = "allow"

[workspace.dependencies]
# own crates
esdicawt = { path = "esdicawt" }
esdicawt-spec = { path = "esdicawt-spec" }
status-list = { path = "status-list" }

# crypto
signature = "3.0"
ed25519-dalek = "3.0"
p256 = "0.14"
p384 = "0.14"
digest = { version = "0.11", features = ["alloc"] }
sha2 = "0.11"
pkcs8 = "0.11"
rand = "0.10"
rand_core = "0.10"
getrandom = "0.4"

# codec
serde = "1.0"
serde_tuple = "1.1"
serde_bytes = "0.11"
thiserror = "2.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde_repr = "0.1"
seabored = { version = "0.1", features = ["serde"] }

# misc
url = { version = "2.5", default-features = false }
tailcall = "1.0"
derive_builder = "0.20"
wasm-bindgen-test = "0.3"
enum-variants-strings = "0.3"
bytes = "1.10"
flate2 = { version = "1.1", default-features = false }
tokio = { version = "1.48", default-features = true }
dernged = "0.2"
insta = "1"
strum = "0.28"
strum_macros = "0.28"
anyhow = { version = "1", default-features = false }

[workspace.dependencies.coset]
git = "https://github.com/beltram/coset.git"
branch = "cose-key"

[workspace.dependencies.cose-key]
git = "https://github.com/beltram/cose-key.git"
tag = "v0.4.0"
#path = "../cose-key"

[workspace.dependencies.ciborium]
git = "https://github.com/beltram/ciborium"
branch = "simple-value+cde"
default-features = false

# enable when generating flamegraph out of benches
[profile.bench]
debug = true

[workspace.lints.clippy]
# Enforced Groups
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Cherry Picks
## Nursery
missing_const_for_fn = "allow"
derive_partial_eq_without_eq = "allow"
significant_drop_tightening = "allow"  # Allowed due false positives
trait_duplication_in_bounds = "allow"  # Allowed due false positives
needless_pass_by_ref_mut = "warn"
## restriction
rc_mutex = "warn"
## Pedantic
needless_continue = "warn"
needless_for_each = "warn"
flat_map_option = "warn"
filter_map_next = "warn"
explicit_into_iter_loop = "warn"
manual_ok_or = "warn"
indexing_slicing = "warn"
unused_self = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
mut_mut = "warn"
option_option = "warn"
ref_option_ref = "warn"
explicit_iter_loop = "warn"

# make criterion (dev-dependency) use the same ciborium fork as the rest of the workspace
[patch.crates-io]
ciborium = { git = "https://github.com/beltram/ciborium", branch = "simple-value+cde" }
