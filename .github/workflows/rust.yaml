name: rust

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [push]

env:
  CARGO_TERM_COLOR: always
  STATIC_BUILD_TARGET: x86_64-unknown-linux-musl
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: '1'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo check --benches

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: git submodule init && git submodule update --recursive --remote
      - run: cargo build --verbose
      - run: cargo clippy --tests -- -D warnings
      - run: cargo clippy -p esdicawt-test-vector --tests -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: backward # remove at some point when all consumers migrated
            args: --features backward
          - name: test-vectors
            args: -p esdicawt-test-vector
          - name: doc
            args: --doc
          - name: benches
            args: --benches
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # one cache per matrix entry since they do not build the same artifacts
          key: ${{ matrix.name }}
        # temporary pinning the draft because the test vectors fail
      - run: git submodule init && git submodule update --recursive --remote && cd draft-ietf-spice-sd-cwt
      - run: cargo test ${{ matrix.args }}

  wasm-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate_paths: ["esdicawt", "esdicawt-spec", "spice-oidc-cwt", "status-list"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            target: wasm32-unknown-unknown
            rustflags: ''
      - uses: browser-actions/setup-chrome@latest
        id: setup-chrome
        with:
            chrome-version: stable
      - run: git submodule init && git submodule update --recursive --remote
      - run: |
            echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
            tool: wasm-pack
      - name: Run tests (wasm)
        run: wasm-pack test --headless --chrome ./${{ matrix.crate_paths }}

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: cargo/hack (verify features compile in isolation)
        run: cargo hack check --feature-powerset --no-dev-deps
