[package]
name = "esdicawt-spec"
edition.workspace = true
version.workspace = true
description = "SD-CWT structs"
authors.workspace = true

[features]
default = []
status = ["dep:status-list"]
backward = []
test-utils = []
# encrypted disclosures, see https://ietf-wg-spice.github.io/draft-ietf-spice-sd-cwt/draft-ietf-spice-sd-cwt.html#name-encrypted-disclosures
aead = ["cose-key/thumbprint", "dep:subtle"]

[dependencies]
coset = { workspace = true, features = ["std"] }
cose-key = { workspace = true, features = ["confirmation"] }
ciborium.workspace = true
digest.workspace = true
status-list = { workspace = true, optional = true }

serde = { workspace = true, features = ["derive"] }
serde_repr.workspace = true
serde_tuple.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
hex.workspace = true
seabored.workspace = true
subtle = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
